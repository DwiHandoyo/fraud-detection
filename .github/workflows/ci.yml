name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: |
          ruff check ml-service/ feature-store/ data-validation/ ui/ \
            --select=E,F,W --ignore=E501,F401 || true

  test-ml-service:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: ml-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../data-validation/requirements.txt
          pip install pytest httpx
      - name: Seed feature store (needed for /predict_by_id tests)
        working-directory: feature-store
        run: |
          pip install -r requirements.txt
          python seed_data.py
          cd feature_repo
          feast apply
          feast materialize-incremental "$(date -u +%Y-%m-%d)T00:00:00"
      - name: Run pytest
        working-directory: ml-service
        run: pytest tests/ -v --tb=short

  test-data-validation:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: data-validation
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed data
        working-directory: feature-store
        run: |
          pip install -r requirements.txt
          python seed_data.py
      - name: Run dataset validation
        working-directory: data-validation
        run: python validate_dataset.py

  build-images:
    runs-on: ubuntu-latest
    needs: [test-ml-service, test-data-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ml-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: false
          tags: fraud-ml:ci
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: fraud-ui:ci
