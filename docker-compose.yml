# Top-level orchestration for local development demo.
#
# Usage:
#   docker compose up -d
#   open http://localhost:8501  (Streamlit UI)
#   open http://localhost:8000/docs (FastAPI docs)
#
# Stop:   docker compose down
# Reset volumes (lose decisions log + prediction log):
#         docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_demo_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fraud", "-d", "fraud"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [fraud-net]

  init-feature-store:
    build: ./ml-service
    image: fraud-ml:0.1
    container_name: fraud-init-fs
    volumes:
      - ./feature-store:/feature-store
      - ./playground:/playground
    command: >
      bash -c "cd /feature-store && python seed_data.py && bash ./apply.sh && SIZE=$$(wc -c < feature_repo/data/online_store.db 2>/dev/null || echo 0); if [ \"$$SIZE\" -lt 1048576 ]; then bash ./materialize.sh; else echo 'Online store exists and populated, skipping materialize'; fi"
    networks: [fraud-net]

  ml-service:
    build: ./ml-service
    image: fraud-ml:0.1
    container_name: fraud-ml
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    volumes:
      # Feast online store needs RW access (SQLite -wal/-shm journal files).
      - ./feature-store/feature_repo:/feature-store/feature_repo
      - ./data-validation:/data-validation:ro
      - predictions-log:/app/logs
      # Models RW so retrain can write new versioned pkls back to host.
      - ./ml-service/models:/app/models
      # Playground RO so /admin/retrain can run retrain_from_feedback.py.
      - ./playground:/playground:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      LOG_FILE: /app/logs/predictions.jsonl
      DATABASE_URL: postgresql+psycopg2://fraud:fraud_demo_only@postgres:5432/fraud
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      init-feature-store:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [fraud-net]

  ui:
    build: ./ui
    image: fraud-ui:0.1
    container_name: fraud-ui
    restart: unless-stopped
    init: true
    ports:
      - "8501:8501"
    volumes:
      - decisions-data:/app/data
      - ./monitoring/reports:/monitoring/reports:ro
    environment:
      ML_SERVICE_URL: http://ml-service:8000
      DECISIONS_LOG: /app/data/decisions.jsonl
      DATABASE_URL: postgresql+psycopg2://fraud:fraud_demo_only@postgres:5432/fraud
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks: [fraud-net]

networks:
  fraud-net:

volumes:
  postgres-data:
  predictions-log:
  decisions-data:
